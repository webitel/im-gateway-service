version: v2
managed:
  enabled: true
  override:
    - file_option: go_package
      value: "github.com/webitel/im-gateway-service/gen/go/admin/v1;admin"
  disable:
    - module: buf.build/googleapis/googleapis
    - module: buf.build/bufbuild/protovalidate

plugins:
  - remote: buf.build/protocolbuffers/go:v1.34.1
    out: ../gen/go/admin
    opt:
      - module=github.com/webitel/im-gateway-service/gen/go/admin

  - remote: buf.build/grpc/go:v1.5.1
    out: ../gen/go/admin
    include_imports: true
    opt:
      - module=github.com/webitel/im-gateway-service/gen/go/admin

inputs:
  - git_repo: https://github.com/webitel/protos.git
    branch: main
    subdir: im
    depth: 1
